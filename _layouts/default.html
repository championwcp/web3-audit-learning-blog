<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07111f">
  <meta name="description" content="{{ page.description | default: site.description }}">
  <title>{% if page.title and page.title != '首页' %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v=20260915-2">
</head>
<body>
  <header class="site-header">
    <div class="nav-shell">
      <a class="brand" href="{{ '/' | relative_url }}">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>合约审计学习笔记</span>
      </a>
      <nav aria-label="主导航">
        <a href="{{ '/' | relative_url }}">文章</a>
        <a href="https://github.com/championwcp" rel="noopener">GitHub</a>
      </nav>
    </div>
  </header>
  <main>{{ content }}</main>
  <footer class="site-footer">
    <div class="footer-shell">
      <p>从公开报告和历史代码中学习。内容仅用于防御性研究与工程教育。</p>
      <p>© 2026 championwcp</p>
    </div>
  </footer>
</body>
</html>
