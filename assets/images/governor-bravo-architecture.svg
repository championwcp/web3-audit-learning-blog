<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Governor Bravo 架构关系</title>
  <desc id="desc">用户调用 Delegator，Delegator 通过 delegatecall 使用 Delegate 逻辑并保存状态，通过的治理动作由 Timelock 延迟执行。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1628"/><stop offset="1" stop-color="#101d33"/></linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#5ee6f0"/><stop offset="1" stop-color="#6e8bff"/></linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#9c7cff"/><stop offset="1" stop-color="#5d72f6"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#64dce8"/></marker>
  </defs>
  <rect width="1200" height="560" rx="28" fill="url(#bg)"/>
  <g opacity=".12" stroke="#7ba4c7"><path d="M0 90H1200M0 180H1200M0 270H1200M0 360H1200M0 450H1200"/><path d="M120 0V560M300 0V560M480 0V560M660 0V560M840 0V560M1020 0V560"/></g>
  <text x="70" y="62" fill="#7891ac" font-family="Arial,'Noto Sans SC',sans-serif" font-size="20" letter-spacing="3">CALL PATH &amp; STATE OWNERSHIP</text>
  <g font-family="Arial,'Noto Sans SC',sans-serif">
    <circle cx="110" cy="260" r="48" fill="#122a43" stroke="#5ee6f0" stroke-width="2"/>
    <circle cx="110" cy="244" r="12" fill="#78edf3"/><path d="M82 292c6-27 50-27 56 0" fill="#78edf3"/>
    <text x="110" y="340" text-anchor="middle" fill="#f0f6ff" font-size="24" font-weight="700">用户</text>
    <text x="110" y="370" text-anchor="middle" fill="#8fa6bd" font-size="16">原始 msg.sender</text>
    <path d="M168 260H270" stroke="#64dce8" stroke-width="3" marker-end="url(#arrow)" filter="url(#glow)"/>
    <text x="220" y="238" text-anchor="middle" fill="#9eb4c8" font-size="15">调用稳定地址</text>
    <rect x="290" y="150" width="275" height="230" rx="22" fill="#10233b" stroke="url(#cyan)" stroke-width="3"/>
    <rect x="315" y="177" width="225" height="44" rx="10" fill="#16304c"/>
    <text x="427" y="207" text-anchor="middle" fill="#7bedf2" font-size="17" font-weight="700">STABLE ENTRY</text>
    <text x="427" y="265" text-anchor="middle" fill="#ffffff" font-size="25" font-weight="700">Delegator / Proxy</text>
    <text x="427" y="305" text-anchor="middle" fill="#a5bad0" font-size="18">保存治理状态与实现地址</text>
    <rect x="338" y="329" width="178" height="28" rx="14" fill="#0c192a"/><text x="427" y="349" text-anchor="middle" fill="#78a3c1" font-size="14">storage 属于这里</text>
    <path d="M565 260H665" stroke="#8c7fff" stroke-width="3" marker-end="url(#arrow)" filter="url(#glow)"/>
    <text x="614" y="238" text-anchor="middle" fill="#b8a9ff" font-size="15">delegatecall</text>
    <rect x="685" y="150" width="250" height="230" rx="22" fill="#151f3d" stroke="url(#violet)" stroke-width="3"/>
    <rect x="710" y="177" width="200" height="44" rx="10" fill="#252451"/>
    <text x="810" y="207" text-anchor="middle" fill="#c0afff" font-size="17" font-weight="700">REPLACEABLE LOGIC</text>
    <text x="810" y="265" text-anchor="middle" fill="#ffffff" font-size="25" font-weight="700">Delegate</text>
    <text x="810" y="305" text-anchor="middle" fill="#a5bad0" font-size="18">提供治理逻辑</text>
    <rect x="721" y="329" width="178" height="28" rx="14" fill="#0c192a"/><text x="810" y="349" text-anchor="middle" fill="#9c91df" font-size="14">代码来自这里</text>
    <path d="M935 260H1020" stroke="#f0b85c" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="1040" y="190" width="110" height="140" rx="18" fill="#2b241a" stroke="#f0b85c" stroke-width="3"/>
    <circle cx="1095" cy="244" r="30" fill="none" stroke="#ffd98a" stroke-width="3"/><path d="M1095 244V224M1095 244L1110 253" stroke="#ffd98a" stroke-width="3" stroke-linecap="round"/>
    <text x="1095" y="302" text-anchor="middle" fill="#fff2d0" font-size="18" font-weight="700">Timelock</text>
    <text x="1095" y="365" text-anchor="middle" fill="#b9a57f" font-size="15">延迟执行</text>
  </g>
</svg>
